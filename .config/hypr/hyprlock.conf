general {
    hide_cursor = true
}
auth {
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Scanning...
}
background {
    path = ~/.config/wallpaper
    color = rgba(efefefff)
    blur_passes = 2
}
input-field {
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(2c2c2cff)
    inner_color = rgba(efefefff)
    font_color = rgba(2c2c2cff)
    placeholder_text = Password or fingerprint
    position = 0, -40
    halign = center
    valign = center
}
label {
    text = $TIME
    font_size = 64
    font_family = JetBrains Mono
    color = rgba(2c2c2cff)
    position = 0, -120
    halign = center
    valign = top
}
