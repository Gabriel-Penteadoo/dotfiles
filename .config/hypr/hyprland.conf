# Hyprland config — Omarchy-style keybinds, Fedora 44
# Docs: https://wiki.hypr.land

monitor = , preferred, auto, auto

$terminal    = alacritty
$fileManager = nautilus
$browser     = firefox
$menu        = fuzzel
$mod         = SUPER

# ---------- Autostart ----------
exec-once = waybar
exec-once = mako
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = swaybg -c 1e1e2e
exec-once = hypridle
exec-once = wlsunset -l 48.9 -L 2.4
# Paris VPN (uncomment to connect at login)
# exec-once = ~/.local/bin/vpn

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

# ---------- Look ----------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = scrolling
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    shadow {
        enabled = true
        range = 6
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = windows, 1, 4, ease, popin 85%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, ease, slide
}

dwindle {
    preserve_split = true
}

# Niri-style scrollable columns
scrolling {
    column_width = 0.5
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    fullscreen_on_one_column = true
    focus_fit_method = 1     # 1 = fit, 0 = center
    follow_focus = true
    wrap_focus = false
    wrap_swapcol = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---------- Input ----------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, scrollMove
gesture = 3, vertical, workspace

# ---------- Keybinds (Omarchy-style) ----------
bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $menu
bind = $mod, W, killactive
bind = $mod, F, fullscreen
bind = $mod, T, togglefloating
bind = $mod, P, pseudo
bind = $mod SHIFT, F, exec, $fileManager
bind = $mod SHIFT, B, exec, $browser
bind = $mod, ESCAPE, exec, loginctl lock-session
bind = $mod SHIFT, ESCAPE, exit
bind = $mod CTRL, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Screenshots
bind = , PRINT, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, PRINT, exec, grim - | wl-copy

# Focus
bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

bind = $mod, HOME, layoutmsg, focus tobeg
bind = $mod, END, layoutmsg, focus toend

# Move windows (between/within columns)
bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, RIGHT, movewindow, r
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, DOWN, movewindow, d

# Move whole columns
bind = $mod CTRL, LEFT, layoutmsg, swapcol l
bind = $mod CTRL, RIGHT, layoutmsg, swapcol r

# Consume / expel windows into / out of columns
bind = $mod, BRACKETLEFT, layoutmsg, consume_or_expel prev
bind = $mod, BRACKETRIGHT, layoutmsg, consume_or_expel next
bind = $mod, COMMA, layoutmsg, consume
bind = $mod, PERIOD, layoutmsg, expel

# Column width
bind = $mod, R, layoutmsg, colresize +conf
bind = $mod SHIFT, R, layoutmsg, colresize -conf
bind = $mod, M, layoutmsg, colresize 1.0
bind = $mod, C, layoutmsg, fit active
bind = $mod, MINUS, layoutmsg, colresize -0.1
bind = $mod, EQUAL, layoutmsg, colresize +0.1
bind = $mod SHIFT, MINUS, resizeactive, 0 -60
bind = $mod SHIFT, EQUAL, resizeactive, 0 60

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mouse move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media / brightness keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
